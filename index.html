<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generatore IBAN Italiano</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iMyIgZmlsbD0iI0ZGRDcwMCIvPjx0ZXh0IHg9IjE2IiB5PSIyMSIgZm9udC1mYW1pbHk9IkFyaWFsIEJsYWNrLEFyaWFsIiBmb250LXdlaWdodD0iOTAwIiBmb250LXNpemU9IjEzIiBmaWxsPSIjMTExMTExIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBsZXR0ZXItc3BhY2luZz0iMC41Ij5JQkFOPC90ZXh0Pjwvc3ZnPg==">
</head>
<body class="theme-acido">

<!-- ── Theme switcher ──────────────────────────────────────────────────── -->
<div class="theme-bar">
  <span id="theme-label">Acido</span>
  <input id="theme-slider" type="range" min="0" max="6" value="0" step="1">
</div>

<!-- ── Main content ───────────────────────────────────────────────────── -->
<div class="container">
  <div class="header">
    <div class="badge">Strumento Bancario</div>
    <h1>IBAN<br><span>Generator</span></h1>
    <p class="subtitle">Formato bancario italiano · ISO 13616</p>
  </div>

  <div class="card">
    <label class="field-label" for="iban-input">IBAN</label>
    <input id="iban-input" type="text" readonly placeholder="— — — — — — — — — — —">
    <button id="copy-btn">Copia negli appunti</button>
    <button id="gen-btn">Genera random IBAN italiano</button>

    <div class="details" id="details">
      <div>
        <div class="detail-label">Paese</div>
        <div class="detail-value" id="d-paese"></div>
      </div>
      <div>
        <div class="detail-label">Check Digits</div>
        <div class="detail-value" id="d-check"></div>
      </div>
      <div>
        <div class="detail-label">ABI</div>
        <div class="detail-value" id="d-abi"></div>
      </div>
      <div>
        <div class="detail-label">CAB</div>
        <div class="detail-value" id="d-cab"></div>
      </div>
    </div>
  </div>

  <p class="footer-note">Solo per test · Non utilizzare per transazioni reali</p>
</div>

<script src="yaiig.js"></script>
</body>
</html>
